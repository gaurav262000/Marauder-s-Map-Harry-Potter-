name: Relay check
on:
  push:
    paths: [.github/workflows/relay-check.yml, scripts/relay-check.mjs, scripts/relay-probe.mjs]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: >-
          node scripts/relay-probe.mjs
          wss://broker.emqx.io:8084/mqtt wss://public:public@public.cloud.shiftr.io wss://test.mosquitto.org:8081/mqtt
      - name: Wait for the latest deploy
        run: for i in $(seq 36); do curl -s https://gaurav262000.github.io/Marauder-s-Map-Harry-Potter-/ | grep -q shiftr && exit 0; sleep 5; done; exit 1
      - run: node scripts/relay-check.mjs https://gaurav262000.github.io/Marauder-s-Map-Harry-Potter-/
