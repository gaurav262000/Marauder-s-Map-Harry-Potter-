name: Relay check
on:
  push:
    paths: [.github/workflows/relay-check.yml, scripts/relay-check.mjs]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/relay-check.mjs https://gaurav262000.github.io/Marauder-s-Map-Harry-Potter-/
